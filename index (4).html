<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de expedientes</title>
<style>
:root{--bg:#eceee9;--card:#fff;--ink:#1d2a2e;--mut:#5d6b70;--line:#d5dad5;--acc:#1f5f66;--acc2:#16474d;--amb:#a96a0b;--amb-bg:#fbefd9;--ok-bg:#dcecee;--cl:#555e63;--cl-bg:#e4e6e7;--err:#b3261e;--err-bg:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc2);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700}
h1{font-size:22px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin:18px 0 8px}
#clock{font-size:13px;opacity:.85}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1.4fr);gap:20px;padding:20px 28px;max-width:1280px;margin:auto;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr;padding:14px}}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.stack{display:grid;gap:20px}
label{display:block;font-weight:600;font-size:13.5px;margin:10px 0 3px}
label small{font-weight:400;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;padding:8px 10px;border:1px solid #b9c1bd;border-radius:4px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,tr:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.err{color:var(--err);font-size:13px;min-height:0;margin-top:3px}
input.bad,textarea.bad{border-color:var(--err);background:var(--err-bg)}
.auto{display:flex;gap:16px;flex-wrap:wrap;background:#f4f6f3;border:1px dashed var(--line);padding:8px 10px;border-radius:4px;font-size:13px;color:var(--mut);margin-top:12px}
.auto b{color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:4px;padding:9px 16px;cursor:pointer;background:var(--acc);color:#fff;margin-top:12px}
button:hover{background:var(--acc2)}
button.sec{background:var(--amb);}button.sec:hover{background:#8a560a}
button.dng{background:#8c2a24}button.dng:hover{background:#6e1f1a}
.msg{margin-top:10px;padding:8px 10px;border-radius:4px;font-size:13.5px;background:var(--ok-bg);color:var(--acc2)}
.msg.e{background:var(--err-bg);color:var(--err)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th{text-align:left;font-size:13px;color:var(--mut);border-bottom:2px solid var(--line);padding:6px 8px}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:#f1f4f1}
tbody tr.sel{background:var(--ok-bg);box-shadow:inset 3px 0 0 var(--acc)}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12.5px;font-weight:600}
.b-Abierto{background:var(--ok-bg);color:var(--acc2)}
.b-Seg{background:var(--amb-bg);color:var(--amb)}
.b-Cerrado{background:var(--cl-bg);color:var(--cl)}
.empty{padding:22px 10px;text-align:center;color:var(--mut)}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}
dt{color:var(--mut);font-size:13.5px}dd{margin:0}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 12px;margin-bottom:8px;border-radius:4px;font-size:14px}
.hist .t{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
.hist .act{background:#fff;border:1px solid var(--line);border-left:4px solid var(--acc)}
.hist .est{background:var(--amb-bg);border:1px dashed var(--amb);color:#5d3b05;font-style:italic}
.hist .tag{font-weight:700;font-style:normal;font-size:12px;margin-right:6px}
.lock{background:var(--cl-bg);color:var(--cl);padding:10px 12px;border-radius:4px;margin-top:14px}
.hist .est.cierre{background:var(--cl-bg);border:1px dashed var(--cl);color:#2f373b}
.hist .est.reap{background:var(--ok-bg);border:1px dashed var(--acc);color:var(--acc2)}
.cyc{margin:0;padding-left:20px;font-size:13.5px}.cyc li{margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header><h1>Gestión de expedientes</h1><span id="clock"></span></header>
<main>
  <div class="stack">
    <section aria-labelledby="t-new">
      <h2 id="t-new">Abrir expediente</h2>
      <form id="fNew" novalidate>
        <label for="nombre">Nombre / alias de la persona</label>
        <input id="nombre" autocomplete="off"><div class="err" id="e-nombre"></div>
        <label for="desc">Descripción del asunto</label>
        <textarea id="desc"></textarea><div class="err" id="e-desc"></div>
        <label for="resp">Nombre del responsable</label>
        <input id="resp" autocomplete="off"><div class="err" id="e-resp"></div>
        <label for="cat">Categoría <small>(opcional)</small></label>
        <select id="cat"><option value="">Sin categoría</option><option>Civil</option><option>Familiar</option><option>Laboral</option></select>
        <div class="auto"><span>Identificador: <b id="nextId"></b></span><span>Fecha y hora: <b id="nowF"></b></span><span>Estado inicial: <b>Abierto</b></span></div>
        <button type="submit">Abrir expediente</button>
        <div id="m-new"></div>
      </form>
    </section>
  </div>
  <div class="stack">
    <section aria-labelledby="t-list">
      <h2 id="t-list">Consulta de expedientes</h2>
      <label for="q" style="margin-top:0">Buscar por identificador o nombre</label>
      <input id="q" type="search" placeholder="Ej.: EXP-0001 o María" autocomplete="off">
      <table>
        <thead><tr><th>Identificador</th><th>Persona</th><th>Responsable</th><th>Estado</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="noRes" class="empty" hidden></div>
    </section>
    <section id="detail" aria-live="polite"><div class="empty">Selecciona un expediente de la lista para ver su detalle e historial.</div></section>
  </div>
</main>
<script>
const KEY='expedientes_app_v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'medium'});
const code=n=>'EXP-'+String(n).padStart(4,'0');
let db, sel=null;

function seed(){
  const h=3600e3, now=Date.now(), iso=ms=>new Date(now-ms).toISOString();
  return {counter:3,items:[
    {id:1,nombre:'María Fernanda López',descripcion:'Reclamo por pago de prestaciones tras despido injustificado.',responsable:'Lic. Carlos Méndez',categoria:'Laboral',estado:'En seguimiento',creado:iso(72*h),
     historial:[
      {tipo:'estado',texto:'Expediente abierto.',a:'Abierto',fecha:iso(72*h)},
      {tipo:'actividad',texto:'Se recibió la documentación laboral de la persona (contrato y boletas de pago).',fecha:iso(48*h)},
      {tipo:'estado',texto:'Cambio de estado: Abierto → En seguimiento.',a:'En seguimiento',fecha:iso(47*h)},
      {tipo:'actividad',texto:'Se envió carta de requerimiento al empleador.',fecha:iso(24*h)}]},
    {id:2,nombre:'Familia Ramírez',descripcion:'Solicitud de revisión de pensión alimenticia.',responsable:'Licda. Ana Beatriz Solís',categoria:'Familiar',estado:'Abierto',creado:iso(5*h),
     historial:[{tipo:'estado',texto:'Expediente abierto.',a:'Abierto',fecha:iso(5*h)}]}
  ]};
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.items)&&r.items.length)return r}catch(e){}
  const d=seed();save(d);return d;
}
function save(d=db){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert('No se pudo guardar en el navegador (almacenamiento bloqueado o lleno).')}}
const bcls=e=>e==='Abierto'?'b-Abierto':e==='Cerrado'?'b-Cerrado':'b-Seg';
const badge=e=>`<span class="badge ${bcls(e)}">${esc(e)}</span>`;

/* Reloj y vista previa del identificador */
function tick(){const n=new Date().toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'medium'});$('clock').textContent=n;$('nowF').textContent=n;$('nextId').textContent=code(db.counter)}
setInterval(tick,1000);

/* Validación */
function check(el,errId,msg){
  const ok=el.value.trim().length>0;
  $(errId).textContent=ok?'':msg;el.classList.toggle('bad',!ok);return ok;
}
$('fNew').addEventListener('submit',ev=>{
  ev.preventDefault();
  const a=check($('nombre'),'e-nombre','El nombre o alias es obligatorio: no puede estar vacío ni contener solo espacios.');
  const b=check($('desc'),'e-desc','La descripción del asunto es obligatoria: no puede estar vacía ni contener solo espacios.');
  const c=check($('resp'),'e-resp','El nombre del responsable es obligatorio: no puede estar vacío ni contener solo espacios.');
  if(!(a&&b&&c)){$('m-new').innerHTML='<div class="msg e">Revisa los campos marcados antes de abrir el expediente.</div>';return}
  const now=new Date().toISOString(), id=db.counter++;
  db.items.push({id,nombre:$('nombre').value.trim(),descripcion:$('desc').value.trim(),responsable:$('resp').value.trim(),categoria:$('cat').value,estado:'Abierto',creado:now,
    historial:[{tipo:'estado',texto:'Expediente abierto.',a:'Abierto',fecha:now}]});
  save();ev.target.reset();
  $('m-new').innerHTML=`<div class="msg">Expediente ${code(id)} abierto correctamente.</div>`;
  $('q').value='';sel=id;tick();render();
});
['nombre','desc','resp'].forEach(i=>$(i).addEventListener('input',()=>{$(i).classList.remove('bad');$('e-'+i).textContent=''}));

/* Lista */
$('q').addEventListener('input',renderList);
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const list=db.items.filter(x=>!q||code(x.id).toLowerCase().includes(q)||String(x.id)===q.replace(/^exp-?0*/,'')||x.nombre.toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);
  $('rows').innerHTML=list.map(x=>`<tr tabindex="0" data-id="${x.id}" class="${x.id===sel?'sel':''}"><td><b>${code(x.id)}</b></td><td>${esc(x.nombre)}</td><td>${esc(x.responsable)}</td><td>${badge(x.estado)}</td></tr>`).join('');
  const nr=$('noRes');
  if(!list.length){nr.hidden=false;nr.textContent=q?`No se encontraron expedientes que coincidan con «${$('q').value.trim()}». Prueba con otro identificador o nombre.`:'Aún no hay expedientes registrados. Abre el primero con el formulario.'}else nr.hidden=true;
}
$('rows').addEventListener('click',e=>{const tr=e.target.closest('tr');if(tr)select(+tr.dataset.id)});
$('rows').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const tr=e.target.closest('tr');if(tr){e.preventDefault();select(+tr.dataset.id)}}});
function select(id){sel=id;render()}

/* Detalle */
const get=id=>db.items.find(x=>x.id===id);
const kind=h=>h.evento||(h.tipo==='estado'&&h.a==='Cerrado'?'cierre':'estado');
/* Reapertura: solo desde «Cerrado», con motivo obligatorio. Solo agrega al historial; nunca borra ni modifica cierres previos. */
function reabrir(id,motivo){
  const x=get(id);
  if(!x)return{ok:false,error:'El expediente no existe.'};
  if(x.estado!=='Cerrado')return{ok:false,error:`No se puede reabrir: el expediente está «${x.estado}». Solo se pueden reabrir expedientes cerrados.`};
  const m=String(motivo==null?'':motivo).trim();
  if(!m)return{ok:false,error:'El motivo de reapertura es obligatorio: no puede estar vacío ni contener solo espacios.'};
  x.estado='En seguimiento';
  x.historial.push({tipo:'estado',evento:'reapertura',texto:'Expediente reabierto (Cerrado → En seguimiento). Motivo: '+m,motivo:m,a:'En seguimiento',fecha:new Date().toISOString()});
  save();return{ok:true};
}
function renderDetail(){
  const x=get(sel),d=$('detail');
  if(!x){d.innerHTML='<div class="empty">Selecciona un expediente de la lista para ver su detalle e historial.</div>';return}
  const acts=x.historial.filter(h=>h.tipo==='actividad').length;
  const TAG={cierre:'CIERRE',reapertura:'REAPERTURA',estado:'CAMBIO DE ESTADO'},CL={cierre:'est cierre',reapertura:'est reap',estado:'est'};
  const hist=x.historial.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(h=>{
    if(h.tipo==='actividad')return `<li class="act"><span class="t">${fmt(h.fecha)}</span><span class="tag">ACTIVIDAD</span>${esc(h.texto)}</li>`;
    const k=kind(h);return `<li class="${CL[k]}"><span class="t">${fmt(h.fecha)}</span><span class="tag">${TAG[k]}</span>${esc(h.texto)}</li>`}).join('');
  const cierres=x.historial.filter(h=>kind(h)==='cierre'),reaps=x.historial.filter(h=>kind(h)==='reapertura');
  const ciclo=x.historial.filter(h=>['cierre','reapertura'].includes(kind(h)));
  const traza=ciclo.length?`<h3>Registro de cierres y reaperturas</h3><ol class="cyc">${ciclo.map(h=>`<li><b>${kind(h)==='cierre'?'Cierre':'Reapertura'}</b> · ${fmt(h.fecha)}<br>${esc(h.texto)}</li>`).join('')}</ol>`:'';
  let acciones='';
  if(x.estado==='Cerrado'){
    acciones=`<div class="lock"><b>Expediente cerrado.</b> No admite nuevas actividades ni cambios de estado hasta que se reabra.</div>
    <h3>Reabrir expediente</h3>
    <form id="fReopen" novalidate>
      <label for="motReap" style="margin-top:0">Motivo de reapertura</label>
      <input id="motReap" autocomplete="off" placeholder="Ej.: Aparecieron nuevos documentos del caso"><div class="err" id="e-reap"></div>
      <button type="submit" class="sec">Reabrir expediente</button>
    </form>`;
  }else{
    acciones=`
    <h3>Registrar actividad</h3>
    <form id="fAct" novalidate>
      <label for="actTxt" class="sr" style="margin-top:0">Descripción de la actividad</label>
      <textarea id="actTxt" placeholder="Describe qué se hizo en este expediente"></textarea><div class="err" id="e-act"></div>
      <button type="submit">Agregar actividad</button>
    </form>
    <h3>Cambio de estado</h3>
    ${x.estado==='Abierto'?'<button id="bSeg" class="sec" style="margin-top:0">Pasar a «En seguimiento»</button>':'<div style="color:var(--mut);font-size:13.5px">El expediente ya está «En seguimiento».</div>'}
    <form id="fClose" novalidate style="margin-top:14px">
      <label for="motivo">Motivo de cierre</label>
      <input id="motivo" autocomplete="off" placeholder="Ej.: Caso resuelto por acuerdo entre las partes"><div class="err" id="e-mot"></div>
      <button type="submit" class="dng">Cerrar expediente</button>
    </form>`;
  }
  d.innerHTML=`
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${code(x.id)} · Detalle</h2>${badge(x.estado)}</div>
    <dl style="margin-top:14px">
      <dt>Persona</dt><dd>${esc(x.nombre)}</dd>
      <dt>Descripción</dt><dd>${esc(x.descripcion)}</dd>
      <dt>Responsable</dt><dd>${esc(x.responsable)}</dd>
      <dt>Categoría</dt><dd>${x.categoria?esc(x.categoria):'<span style="color:var(--mut)">Sin categoría</span>'}</dd>
      <dt>Fecha de apertura</dt><dd>${fmt(x.creado)}</dd>
      <dt>Actividades</dt><dd>${acts}</dd>
      <dt>Cierres / reaperturas</dt><dd>${cierres.length} / ${reaps.length}</dd>
    </dl>
    ${acciones}
    ${traza}
    <h3>Historial</h3><ul class="hist">${hist}</ul>`;
  const fa=$('fAct');if(fa){
    fa.addEventListener('submit',ev=>{ev.preventDefault();
      const t=$('actTxt');if(!check(t,'e-act','La descripción de la actividad es obligatoria: no puede estar vacía ni contener solo espacios.'))return;
      const cur=get(sel);if(cur.estado==='Cerrado')return render();
      cur.historial.push({tipo:'actividad',texto:t.value.trim(),fecha:new Date().toISOString()});save();render()});
    $('actTxt').addEventListener('input',e=>{e.target.classList.remove('bad');$('e-act').textContent=''});
    const bs=$('bSeg');if(bs)bs.addEventListener('click',()=>{const cur=get(sel);if(cur.estado!=='Abierto')return;
      cur.estado='En seguimiento';cur.historial.push({tipo:'estado',texto:'Cambio de estado: Abierto → En seguimiento.',a:'En seguimiento',fecha:new Date().toISOString()});save();render()});
    $('fClose').addEventListener('submit',ev=>{ev.preventDefault();
      const cur=get(sel),m=$('motivo');
      if(!cur.historial.some(h=>h.tipo==='actividad')){$('e-mot').textContent='No se puede cerrar: registra al menos una actividad antes de cerrar el expediente.';return}
      if(!check(m,'e-mot','El motivo de cierre es obligatorio: no puede estar vacío ni contener solo espacios.'))return;
      if(cur.estado==='Cerrado')return render();
      cur.estado='Cerrado';cur.historial.push({tipo:'estado',evento:'cierre',texto:'Expediente cerrado. Motivo: '+m.value.trim(),motivo:m.value.trim(),a:'Cerrado',fecha:new Date().toISOString()});save();render()});
    $('motivo').addEventListener('input',e=>{e.target.classList.remove('bad');$('e-mot').textContent=''});
  }
  const fr=$('fReopen');if(fr){
    fr.addEventListener('submit',ev=>{ev.preventDefault();
      const m=$('motReap');
      if(!check(m,'e-reap','El motivo de reapertura es obligatorio: no puede estar vacío ni contener solo espacios.'))return;
      const r=reabrir(sel,m.value);
      if(!r.ok){$('e-reap').textContent=r.error;return}
      render()});
    $('motReap').addEventListener('input',e=>{e.target.classList.remove('bad');$('e-reap').textContent=''});
  }
}
function render(){renderList();renderDetail()}
db=load();tick();render();
</script>
</body>
</html>
